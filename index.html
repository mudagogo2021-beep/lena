<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>For Lena 💕</title><meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💕</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Quicksand,system-ui,sans-serif;background:linear-gradient(170deg,#ffe3ec,#ffd1dc 45%,#f3d9ff);color:#5a3a4a;overflow-x:hidden}
.h{position:fixed;bottom:-40px;color:#ff7aa2;opacity:.55;animation:up linear infinite;pointer-events:none}@keyframes up{to{transform:translateY(-115vh) rotate(25deg)}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:48px 20px 60px;text-align:center}
h1{font-family:'Dancing Script',cursive;font-size:3.4rem;margin:0;color:#d6336c}.sub{margin:6px 0 30px;font-size:1.05rem}
.frame{position:relative;background:#fff;padding:14px 14px 50px;border-radius:6px;box-shadow:0 18px 40px #d6336c33;transform:rotate(-2deg);max-width:340px;margin:0 auto 34px}
.frame .ph{aspect-ratio:1;background:#ffeef3;border:2px dashed #ffb3c8;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;color:#d6336c;overflow:hidden}
.frame img{width:100%;height:100%;object-fit:cover}.frame .cap{position:absolute;bottom:14px;left:0;right:0;font-family:'Dancing Script',cursive;font-size:1.5rem;color:#d6336c}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 34px}.gal div{aspect-ratio:1;border-radius:12px;overflow:hidden;background:#ffffff88;position:relative}.gal img{width:100%;height:100%;object-fit:cover}
.gal button{position:absolute;top:4px;right:4px;border:0;background:#fff9;border-radius:50%;width:22px;height:22px;cursor:pointer}
.add{display:inline-block;margin:0 0 30px;padding:10px 22px;border-radius:999px;border:2px solid #ff7aa2;color:#d6336c;background:#fff8;font-weight:600;cursor:pointer}
.note{font-family:'Dancing Script',cursive;font-size:1.7rem;line-height:1.35;margin:0 0 34px}
a.chat{display:inline-block;padding:18px 40px;border-radius:999px;background:linear-gradient(135deg,#ff6f9c,#c86bff);color:#fff;font-weight:700;font-size:1.2rem;text-decoration:none;box-shadow:0 12px 28px #ff6f9c66;animation:beat 1.8s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.06)}30%{transform:scale(1)}45%{transform:scale(1.04)}}
small{display:block;margin-top:24px;opacity:.75}
</style></head><body>
<main>
<h1>For Lena 💕</h1><div class="sub">A little corner of the internet, just for you.</div>
<div class="frame"><div class="ph" id="main" onclick="pick(true)"><div style="font-size:2.4rem">📷</div><div>Tap to add our photo</div></div><div class="cap">us 💞</div></div>
<div class="gal" id="gal"></div>
<label class="add">＋ Add more photos<input type="file" accept="image/*" multiple hidden onchange="addMany(this.files)"></label>
<p class="note">Every chat with you is my favorite part of the day.<br>Tap below whenever you miss me 💌</p>
<a class="chat" href="https://britney-linda-editing-cannon.trycloudflare.com">💬 Chat with Muda</a>
<small>Bookmark this page. It always opens our chat.<br>Your photos stay saved in your own browser.</small>
</main>
<input type="file" id="one" accept="image/*" hidden>
<script>
const K='lena_photos',M='lena_main';
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};i.src=URL.createObjectURL(f)})}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Storage is full, try removing a photo.')}}
function list(){return JSON.parse(localStorage.getItem(K)||'[]')}
function render(){const m=JSON.parse(localStorage.getItem(M)||'null');if(m)document.getElementById('main').innerHTML='<img src="'+m+'">';
const g=document.getElementById('gal');g.innerHTML='';list().forEach((p,i)=>{g.insertAdjacentHTML('beforeend','<div><img src="'+p+'"><button onclick="del('+i+')">×</button></div>')})}
function pick(){const o=document.getElementById('one');o.onchange=async()=>{if(o.files[0]){save(M,await shrink(o.files[0]));render()}};o.click()}
async function addMany(fs){const l=list();for(const f of fs)l.push(await shrink(f));save(K,l);render()}
function del(i){const l=list();l.splice(i,1);save(K,l);render()}
render();
const e=['💕','💗','💖','🌸','💞'];for(let i=0;i<16;i++){const d=document.createElement('div');d.className='h';d.textContent=e[i%e.length];d.style.cssText='left:'+Math.random()*100+'vw;font-size:'+(14+Math.random()*24)+'px;animation-duration:'+(10+Math.random()*12)+'s;animation-delay:-'+Math.random()*20+'s';document.body.appendChild(d)}
</script></body></html>
